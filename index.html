<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Online Game</title>

<style>
body {
  margin: 0;
  overflow: hidden;
  background: #222;
}

canvas {
  background: #333;
  display: block;
  margin: auto;
}
</style>

</head>
<body>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = 800;
canvas.height = 600;

const socket = new WebSocket("ws://localhost:3000");

const player = {
  x: 100,
  y: 100,
  size: 50,
  speed: 4
};

const otherPlayers = {};

socket.onopen = () => {
  console.log("connected");
};

// サーバーから受信
socket.onmessage = (event) => {

  const data = JSON.parse(event.data);

  if (data.type === "players") {

    Object.assign(otherPlayers, data.players);

  }

};

const keys = {};

window.addEventListener("keydown", (e) => {
  keys[e.key.toLowerCase()] = true;
});

window.addEventListener("keyup", (e) => {
  keys[e.key.toLowerCase()] = false;
});

function update() {

  let moved = false;

  if (keys["w"]) {
    player.y -= player.speed;
    moved = true;
  }

  if (keys["s"]) {
    player.y += player.speed;
    moved = true;
  }

  if (keys["a"]) {
    player.x -= player.speed;
    moved = true;
  }

  if (keys["d"]) {
    player.x += player.speed;
    moved = true;
  }

  // サーバーへ送信
  if (moved && socket.readyState === WebSocket.OPEN) {

    socket.send(JSON.stringify({
      type: "move",
      x: player.x,
      y: player.y
    }));

  }

}

function draw() {

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // 自分
  ctx.fillStyle = "deepskyblue";

  ctx.fillRect(
    player.x,
    player.y,
    player.size,
    player.size
  );

  // 他プレイヤー
  ctx.fillStyle = "red";

  for (const id in otherPlayers) {

    const p = otherPlayers[id];

    ctx.fillRect(
      p.x,
      p.y,
      50,
      50
    );

  }

}

function gameLoop() {

  update();
  draw();

  requestAnimationFrame(gameLoop);

}

gameLoop();

</script>

</body>
</html>
